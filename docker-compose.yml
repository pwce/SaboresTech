services:
  db:
    image: postgres:16-alpine
    container_name: sabores_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE:-SaboresTech}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DATABASE:-SaboresTech}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sabores_net

  backend:
    build:
      context: ./backend
    container_name: sabores_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE: ${DATABASE:-SaboresTech}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret}
      COOKIE_KEY: ${COOKIE_KEY:-changeme_cookie_key}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/src/uploads
    networks:
      - sabores_net

  frontend:
    build:
      context: ./frontend
    container_name: sabores_frontend
    restart: unless-stopped
    environment:
      # URL pública (accesible desde el navegador del cliente) donde vive el backend.
      # PUBLIC_HOST se define en el .env de la raíz: la IP/dominio del servidor donde corre todo el stack.
      VITE_API_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-3000}/api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - sabores_net

volumes:
  db_data:
  backend_uploads:

networks:
  sabores_net:
    driver: bridge
